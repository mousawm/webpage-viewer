<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Web Page Viewer</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    html, body { margin: 0; height: 100%; font-family: Segoe UI, sans-serif; background: #fff; }
    #frame { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    #setup { display: none; height: 100%; flex-direction: column; align-items: center;
             justify-content: center; gap: 10px; padding: 16px; box-sizing: border-box; }
    #setup input { width: min(520px, 90%); padding: 8px; font-size: 15px; }
    #setup button, #gear { padding: 8px 16px; font-size: 14px; cursor: pointer; }
    #hint { color: #666; font-size: 12px; max-width: 520px; text-align: center; }
    #gear { position: absolute; top: 4px; right: 4px; opacity: 0; transition: opacity .2s;
            background: #ffffffcc; border: 1px solid #aaa; border-radius: 4px; z-index: 5; }
    body:hover #gear { opacity: .85; }
    body.slideshow #gear { display: none !important; }
    body:focus { outline: none; }
    #diag { display: none; position: absolute; left: 4px; bottom: 4px; z-index: 6; margin: 0;
            padding: 6px 8px; font: 12px/1.4 Consolas, monospace; white-space: pre; color: #fff;
            background: #000c; border-radius: 4px; pointer-events: none; }
    #diag.on { display: block; }
    #diaglink { background: none; border: 0; color: #666; font-size: 12px; text-decoration: underline;
                cursor: pointer; }
  </style>
</head>
<body tabindex="-1">
  <button id="gear" title="Change web page">⚙</button>
  <iframe id="frame" allow="fullscreen; autoplay; clipboard-write" referrerpolicy="no-referrer"></iframe>
  <pre id="diag"></pre>
  <div id="setup">
    <h3>Web Page Viewer</h3>
    <input id="url" type="url" placeholder="https://example.com" />
    <button id="save">Show page</button>
    <button id="diaglink">Show diagnostics (press D any time)</button>
    <div id="hint">Use an https address. Some sites (Google, Facebook, banks…) forbid being
      embedded and will appear blank. Your own pages, Power BI/Grafana embeds, YouTube
      <code>/embed/</code> links, Wikipedia, etc. work.</div>
  </div>
  <script>
    const $ = id => document.getElementById(id);
    const settings = () => Office.context.document.settings;

    function normalize(u) {
      u = u.trim();
      if (!u) return "";
      if (!/^https?:\/\//i.test(u)) u = "https://" + u;
      return u;
    }
    function show(url) {
      if (url) {
        $("frame").style.display = "block";
        $("setup").style.display = "none";
        $("gear").style.display = "block";
        if ($("frame").src !== url) $("frame").src = url;
      } else {
        $("frame").style.display = "none";
        $("gear").style.display = "none";
        $("setup").style.display = "flex";
        $("url").value = settings().get("url") || "";
      }
    }
    Office.onReady(() => {
      show(settings().get("url"));
      $("save").onclick = () => {
        const url = normalize($("url").value);
        if (!url) return;
        settings().set("url", url);
        settings().saveAsync(() => show(url));
      };
      $("url").onkeydown = e => { if (e.key === "Enter") $("save").click(); };
      $("gear").onclick = () => show(null);

      // "read" = slide show, "edit" = normal editing view.
      let inShow = false;
      const applyView = v => {
        inShow = v === "read";
        document.body.classList.toggle("slideshow", inShow);
        if (inShow) activatePage(); else if (pageActive) pageActive = false;
        if ($("diag").classList.contains("on")) diag();
      };
      try {
        Office.context.document.getActiveViewAsync(r => {
          if (r.status === Office.AsyncResultStatus.Succeeded) applyView(r.value);
        });
        Office.context.document.addHandlerAsync(Office.EventType.ActiveViewChanged,
          e => applyView(e.activeView));
      } catch (err) { /* older hosts: gear stays hover-only */ }

      // Diagnostics: which browser engine and pixel density PowerPoint gives the add-in.
      const engine = () => {
        const ua = navigator.userAgent;
        if (/Edg\//.test(ua)) return "Edge WebView2 (Chromium)";
        if (/Edge\//.test(ua)) return "Legacy Edge (EdgeHTML)";
        if (/Trident|MSIE/.test(ua)) return "Internet Explorer (Trident)";
        return ua;
      };
      const diag = () => {
        const d = Office.context.diagnostics || {};
        const dpr = window.devicePixelRatio;
        $("diag").textContent = [
          "Engine:   " + engine(),
          "Pixel density (devicePixelRatio): " + dpr,
          "Box: " + innerWidth + " x " + innerHeight + " CSS px = "
            + Math.round(innerWidth * dpr) + " x " + Math.round(innerHeight * dpr) + " device px",
          "Office:   " + [d.host, d.platform, d.version].filter(Boolean).join(" "),
          "View:     " + (inShow ? "slide show" : "edit"),
        ].join("\n");
      };
      const toggleDiag = () => { diag(); $("diag").classList.toggle("on"); };
      $("diaglink").onclick = toggleDiag;
      window.addEventListener("resize", () => { if ($("diag").classList.contains("on")) diag(); });
      document.addEventListener("keydown", e => {
        if ((e.key === "d" || e.key === "D") && !e.ctrlKey && !e.altKey && !e.metaKey
            && !(e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))) toggleDiag();
      });

      // Presentation pointers/clickers send ordinary keys (PageDown/PageUp, arrows).
      // Once the embedded page has focus those keys go to the page instead of
      // PowerPoint, so the slide stops advancing. Handle the keys here and move
      // slides ourselves, and take focus back after the audience page is clicked.
      const NEXT = ["PageDown", "ArrowRight", "ArrowDown", "Enter", " ", "n", "N"];
      const PREV = ["PageUp", "ArrowLeft", "ArrowUp", "Backspace", "p", "P"];
      const go = idx => Office.context.document.goToByIdAsync(idx, Office.GoToType.Index, () => {});
      let lastNav = 0;
      document.addEventListener("keydown", e => {
        if (!inShow || e.ctrlKey || e.altKey || e.metaKey) return;
        if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
        let idx;
        if (NEXT.includes(e.key)) idx = Office.Index.Next;
        else if (PREV.includes(e.key)) idx = Office.Index.Previous;
        else if (e.key === "Home") idx = Office.Index.First;
        else if (e.key === "End") idx = Office.Index.Last;
        else return;
        e.preventDefault();
        const now = Date.now();
        if (now - lastNav < 150) return; // clickers can double-fire or auto-repeat
        lastNav = now;
        go(idx);
      });

      function takeFocus() {
        if (document.activeElement && document.activeElement !== document.body) {
          document.activeElement.blur();
        }
        window.focus();
        document.body.focus();
      }
      // Slide show: make the embedded page active right away so it reacts to the mouse
      // wheel, clicks and dropdowns without needing a first "activating" click.
      let pageActive = false;
      function activatePage() {
        pageActive = true;
        try { $("frame").focus(); $("frame").contentWindow.focus(); } catch (err) { /* cross-origin */ }
      }
      // Never pull focus away while the pointer is over the page (that closes dropdown
      // menus and select lists). Once the pointer leaves the page, give focus back so
      // the next clicker press changes the slide.
      $("frame").addEventListener("mouseenter", () => { if (inShow) pageActive = true; });
      $("frame").addEventListener("mouseleave", () => {
        if (inShow && pageActive) { pageActive = false; takeFocus(); }
      });
    });
  </script>
</body>
</html>
