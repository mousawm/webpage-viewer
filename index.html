<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Web Page Viewer</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    html, body { margin: 0; height: 100%; font-family: Segoe UI, sans-serif; background: #fff; }
    #frame { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    #setup { display: none; height: 100%; flex-direction: column; align-items: center;
             justify-content: center; padding: 16px; box-sizing: border-box; }
    #setup input { width: 90%; max-width: 520px; padding: 8px; font-size: 15px; }
    #setup > * { margin: 5px 0; }
    #setup button, #gear { padding: 8px 16px; font-size: 14px; cursor: pointer; }
    #hint { color: #666; font-size: 12px; max-width: 520px; text-align: center; }
    #gear { position: absolute; top: 4px; right: 4px; opacity: 0; transition: opacity .2s;
            background: rgba(255,255,255,.8); border: 1px solid #aaa; border-radius: 4px; z-index: 5; }
    body:hover #gear { opacity: .85; }
    body.slideshow #gear { display: none !important; }
    body:focus { outline: none; }
    #keysrow, #autorow { color: #444; font-size: 12px; max-width: 520px; }
    #diag { display: none; position: absolute; left: 4px; bottom: 4px; z-index: 6; margin: 0;
            padding: 6px 8px; font: 12px/1.4 Consolas, monospace; white-space: pre; color: #fff;
            background: rgba(0,0,0,.8); border-radius: 4px; pointer-events: none; }
    #diag.on { display: block; }
    #diaglink { background: none; border: 0; color: #666; font-size: 12px; text-decoration: underline;
                cursor: pointer; }
  </style>
</head>
<body tabindex="-1">
  <button id="gear" title="Change web page">⚙</button>
  <iframe id="frame" allow="fullscreen; autoplay; clipboard-write" referrerpolicy="no-referrer"></iframe>
  <pre id="diag"></pre>
  <div id="setup">
    <h3>Web Page Viewer</h3>
    <input id="url" type="url" placeholder="https://example.com" />
    <button id="save">Show page</button>
    <label id="keysrow"><input id="pagekeys" type="checkbox" /> Keep keyboard on the page during the slide
      show (for typing in text boxes). The clicker's next/previous buttons will not change slides while this is on.</label>
    <label id="autorow"><input id="autoact" type="checkbox" /> Activate the page when the slide show
      starts, so the first click works in the page. The clicker keeps changing slides.</label>
    <button id="diaglink">Show diagnostics (press D any time)</button>
    <div id="hint">Use an https address. Some sites (Google, Facebook, banks…) forbid being
      embedded and will appear blank. Your own pages, Power BI/Grafana embeds, YouTube
      <code>/embed/</code> links, Wikipedia, etc. work.
      <br /><a href="support.html" target="_blank">Help</a> ·
      <a href="privacy.html" target="_blank">Privacy</a> ·
      <a href="terms.html" target="_blank">Terms</a></div>
  </div>
  <script>
    // Plain ES5 on purpose: older Office (2013/2016/2019) runs add-ins in Internet
    // Explorer 11, which cannot parse arrow functions, let/const or Array.includes.
    function $(id) { return document.getElementById(id); }
    function settings() { return Office.context.document.settings; }
    function setClass(el, name, on) {
      if (on) el.classList.add(name); else el.classList.remove(name);
    }
    function isField(t) { return !!(t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)); }

    function normalize(u) {
      u = u.replace(/^\s+|\s+$/g, "");
      if (!u) return "";
      if (!/^https?:\/\//i.test(u)) u = "https://" + u;
      return u;
    }
    function show(url) {
      if (url) {
        $("frame").style.display = "block";
        $("setup").style.display = "none";
        $("gear").style.display = "block";
        if ($("frame").src !== url) $("frame").src = url;
      } else {
        $("frame").style.display = "none";
        $("gear").style.display = "none";
        $("setup").style.display = "flex";
        $("url").value = settings().get("url") || "";
      }
    }
    Office.onReady(function () {
      show(settings().get("url"));
      $("save").onclick = function () {
        var url = normalize($("url").value);
        if (!url) return;
        settings().set("url", url);
        settings().saveAsync(function () { show(url); });
      };
      $("url").onkeydown = function (e) { if (e.key === "Enter") $("save").click(); };
      $("gear").onclick = function () { show(null); };

      // "read" = slide show, "edit" = normal editing view.
      var inShow = false;
      function applyView(v) {
        inShow = v === "read";
        setClass(document.body, "slideshow", inShow);
        if (inShow) activateSoon();
        if ($("diag").classList.contains("on")) diag();
      }
      try {
        Office.context.document.getActiveViewAsync(function (r) {
          if (r.status === Office.AsyncResultStatus.Succeeded) applyView(r.value);
        });
        Office.context.document.addHandlerAsync(Office.EventType.ActiveViewChanged,
          function (e) { applyView(e.activeView); });
      } catch (err) { /* older hosts: gear stays hover-only */ }

      // Diagnostics: which browser engine and pixel density PowerPoint gives the add-in.
      function engine() {
        var ua = navigator.userAgent;
        if (/Edg\//.test(ua)) return "Edge WebView2 (Chromium)";
        if (/Edge\//.test(ua)) return "Legacy Edge (EdgeHTML)";
        if (/Trident|MSIE/.test(ua)) return "Internet Explorer (Trident)";
        return ua;
      }
      var lastKey = "none";
      function diag() {
        var d = Office.context.diagnostics || {};
        var dpr = window.devicePixelRatio || 1;
        $("diag").textContent = [
          "Engine:   " + engine(),
          "Pixel density (devicePixelRatio): " + dpr,
          "Box: " + innerWidth + " x " + innerHeight + " CSS px = "
            + Math.round(innerWidth * dpr) + " x " + Math.round(innerHeight * dpr) + " device px",
          "Office:   " + [d.host, d.platform, d.version].filter(Boolean).join(" "),
          "View:     " + (inShow ? "slide show" : "edit"),
          "Activate: " + (autoActivate() ? "at slide show start" : "off"),
          "Focus:    " + (document.activeElement === $("frame") ? "web page" : "add-in/slide")
            + (document.hasFocus() ? "" : " (window unfocused)"),
          "Last key: " + lastKey
        ].join("\n");
      }
      document.addEventListener("keydown", function (e) {
        lastKey = e.key + " @ " + new Date().toLocaleTimeString();
        if ($("diag").classList.contains("on")) diag();
      }, true);
      function toggleDiag() {
        diag();
        setClass($("diag"), "on", !$("diag").classList.contains("on"));
      }
      $("diaglink").onclick = toggleDiag;
      window.addEventListener("resize", function () { if ($("diag").classList.contains("on")) diag(); });
      document.addEventListener("keydown", function (e) {
        if ((e.key === "d" || e.key === "D") && !e.ctrlKey && !e.altKey && !e.metaKey
            && !isField(e.target)) toggleDiag();
      });

      // Presentation pointers/clickers send ordinary keys (PageDown/PageUp, arrows).
      // Once the embedded page has focus those keys go to the page instead of
      // PowerPoint, so the slide stops advancing. Handle the keys here and move
      // slides ourselves, and take focus back after the audience page is clicked.
      // IE11 names some keys differently ("Right", "Spacebar"), so both are listed.
      var NEXT = ["PageDown", "ArrowRight", "Right", "ArrowDown", "Down", "Enter", " ", "Spacebar", "n", "N"];
      var PREV = ["PageUp", "ArrowLeft", "Left", "ArrowUp", "Up", "Backspace", "p", "P"];
      function go(idx) { Office.context.document.goToByIdAsync(idx, Office.GoToType.Index, function () {}); }
      var lastNav = 0;
      document.addEventListener("keydown", function (e) {
        if (!inShow || e.ctrlKey || e.altKey || e.metaKey) return;
        if (isField(e.target)) return;
        var idx;
        if (NEXT.indexOf(e.key) >= 0) idx = Office.Index.Next;
        else if (PREV.indexOf(e.key) >= 0) idx = Office.Index.Previous;
        else if (e.key === "Home") idx = Office.Index.First;
        else if (e.key === "End") idx = Office.Index.Last;
        else return;
        e.preventDefault();
        var now = Date.now();
        if (now - lastNav < 150) return; // clickers can double-fire or auto-repeat
        lastNav = now;
        go(idx);
      });

      function takeFocus() {
        if (document.activeElement && document.activeElement !== document.body) {
          document.activeElement.blur();
        }
        window.focus();
        document.body.focus();
      }
      // Focus policy during the slide show. The page is cross-origin, so we cannot see
      // keys, clicks or open dropdowns inside it. Mouse wheel and clicks reach the page
      // without it having focus, so by default the slide (clicker keys) keeps focus.
      // A click moves focus into the page; we give it back after a grace period (long
      // enough to open and pick from a dropdown) or as soon as the mouse leaves the page.
      // The "Keep keyboard on the page" option (set under the gear) turns this off for typing.
      var GRACE_MS = 4000;
      var graceTimer = 0;
      function keepOnPage() { return !!settings().get("pageKeys"); }
      $("pagekeys").checked = keepOnPage();
      $("pagekeys").onchange = function () {
        settings().set("pageKeys", $("pagekeys").checked);
        settings().saveAsync(function () {});
      };
      window.addEventListener("blur", function () {
        if (!inShow || keepOnPage()) return;
        clearTimeout(graceTimer);
        graceTimer = setTimeout(function () {
          if (inShow && !keepOnPage() && document.activeElement === $("frame")) takeFocus();
        }, GRACE_MS);
      });
      // Slide show start: make the add-in active straight away, so the first click lands
      // in the page instead of only activating the box. Focus goes to the add-in itself,
      // not into the page, so clicker keys reach the handler above and still change slides.
      // Retried briefly because the slide show window may take focus after we are told.
      function autoActivate() { return !settings().get("noAutoActivate"); }
      function activate() {
        if (!inShow || !autoActivate() || document.hidden) return;
        if (document.activeElement === $("frame")) return; // already in the page
        if (keepOnPage()) { try { $("frame").focus(); } catch (err) { /* cross-origin */ } }
        else takeFocus();
      }
      function activateSoon() {
        activate();
        setTimeout(activate, 300);
        setTimeout(activate, 1000);
      }
      $("autoact").checked = autoActivate();
      $("autoact").onchange = function () {
        settings().set("noAutoActivate", !$("autoact").checked);
        settings().saveAsync(function () {});
      };
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden) activateSoon();
      });
      $("frame").addEventListener("mouseleave", function () {
        if (!inShow || keepOnPage()) return;
        clearTimeout(graceTimer);
        if (document.activeElement === $("frame")) takeFocus();
      });
    });
  </script>
</body>
</html>
