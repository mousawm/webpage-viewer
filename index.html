<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Web Page Viewer</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: Segoe UI, sans-serif; background: #fff; }
    /* The page is laid out at --res times the box size, then scaled down to fit,
       so it renders like a higher-resolution (larger) browser window. */
    #frame { --res: 1.5; position: absolute; top: 0; left: 0; border: 0; transform-origin: 0 0;
             width: calc(100% * var(--res)); height: calc(100% * var(--res));
             transform: scale(calc(1 / var(--res))); }
    #setup { display: none; height: 100%; flex-direction: column; align-items: center;
             justify-content: center; gap: 10px; padding: 16px; box-sizing: border-box; }
    #setup input { width: min(520px, 90%); padding: 8px; font-size: 15px; }
    #setup button, #gear { padding: 8px 16px; font-size: 14px; cursor: pointer; }
    #hint { color: #666; font-size: 12px; max-width: 520px; text-align: center; }
    #gear { position: absolute; top: 4px; right: 4px; opacity: 0; transition: opacity .2s;
            background: #ffffffcc; border: 1px solid #aaa; border-radius: 4px; z-index: 5; }
    body:hover #gear { opacity: .85; }
    body.slideshow #gear { display: none !important; }
    body:focus { outline: none; }
  </style>
</head>
<body tabindex="-1">
  <button id="gear" title="Change web page">⚙</button>
  <iframe id="frame" allow="fullscreen; autoplay; clipboard-write" referrerpolicy="no-referrer"></iframe>
  <div id="setup">
    <h3>Web Page Viewer</h3>
    <input id="url" type="url" placeholder="https://example.com" />
    <label>Page resolution
      <select id="res">
        <option value="1">1× (standard)</option>
        <option value="1.5">1.5×</option>
        <option value="2">2×</option>
        <option value="3">3×</option>
      </select>
    </label>
    <button id="save">Show page</button>
    <div id="hint">Use an https address. Some sites (Google, Facebook, banks…) forbid being
      embedded and will appear blank. Your own pages, Power BI/Grafana embeds, YouTube
      <code>/embed/</code> links, Wikipedia, etc. work.</div>
  </div>
  <script>
    const $ = id => document.getElementById(id);
    const settings = () => Office.context.document.settings;

    function normalize(u) {
      u = u.trim();
      if (!u) return "";
      if (!/^https?:\/\//i.test(u)) u = "https://" + u;
      return u;
    }
    const DEFAULT_RES = "1.5";
    const applyRes = r => $("frame").style.setProperty("--res", r);
    function show(url) {
      applyRes(settings().get("res") || DEFAULT_RES);
      if (url) {
        $("frame").style.display = "block";
        $("setup").style.display = "none";
        $("gear").style.display = "block";
        if ($("frame").src !== url) $("frame").src = url;
      } else {
        $("frame").style.display = "none";
        $("gear").style.display = "none";
        $("setup").style.display = "flex";
        $("url").value = settings().get("url") || "";
        $("res").value = settings().get("res") || DEFAULT_RES;
      }
    }
    Office.onReady(() => {
      show(settings().get("url"));
      $("save").onclick = () => {
        const url = normalize($("url").value);
        if (!url) return;
        settings().set("url", url);
        settings().set("res", $("res").value);
        settings().saveAsync(() => show(url));
      };
      $("url").onkeydown = e => { if (e.key === "Enter") $("save").click(); };
      $("gear").onclick = () => show(null);

      // "read" = slide show, "edit" = normal editing view.
      let inShow = false;
      const applyView = v => {
        inShow = v === "read";
        document.body.classList.toggle("slideshow", inShow);
        if (inShow) takeFocus();
      };
      try {
        Office.context.document.getActiveViewAsync(r => {
          if (r.status === Office.AsyncResultStatus.Succeeded) applyView(r.value);
        });
        Office.context.document.addHandlerAsync(Office.EventType.ActiveViewChanged,
          e => applyView(e.activeView));
      } catch (err) { /* older hosts: gear stays hover-only */ }

      // Presentation pointers/clickers send ordinary keys (PageDown/PageUp, arrows).
      // Once the embedded page has focus those keys go to the page instead of
      // PowerPoint, so the slide stops advancing. Handle the keys here and move
      // slides ourselves, and take focus back after the audience page is clicked.
      const NEXT = ["PageDown", "ArrowRight", "ArrowDown", "Enter", " ", "n", "N"];
      const PREV = ["PageUp", "ArrowLeft", "ArrowUp", "Backspace", "p", "P"];
      const go = idx => Office.context.document.goToByIdAsync(idx, Office.GoToType.Index, () => {});
      let lastNav = 0;
      document.addEventListener("keydown", e => {
        if (!inShow || e.ctrlKey || e.altKey || e.metaKey) return;
        if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
        let idx;
        if (NEXT.includes(e.key)) idx = Office.Index.Next;
        else if (PREV.includes(e.key)) idx = Office.Index.Previous;
        else if (e.key === "Home") idx = Office.Index.First;
        else if (e.key === "End") idx = Office.Index.Last;
        else return;
        e.preventDefault();
        const now = Date.now();
        if (now - lastNav < 150) return; // clickers can double-fire or auto-repeat
        lastNav = now;
        go(idx);
      });

      function takeFocus() {
        if (document.activeElement && document.activeElement !== document.body) {
          document.activeElement.blur();
        }
        window.focus();
        document.body.focus();
      }
      // Clicking inside the embedded page moves focus into it. Give the click time
      // to land, then hand focus back so the next clicker press changes the slide.
      window.addEventListener("blur", () => {
        if (!inShow) return;
        setTimeout(() => { if (document.activeElement === $("frame")) takeFocus(); }, 400);
      });
    });
  </script>
</body>
</html>
